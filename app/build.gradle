plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.huawo.nt.sdkdemo'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.huawo.nt.sdkdemo"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // Local vendor AARs under app/libs (AI needs BmpConvert + jl_pack + QW + ai)
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Local AI AARs do not carry Maven dependencies; OmniAgent pulls its API, core and Opus runtime.
    implementation 'com.adf:oa-oas:2.5.0'

    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.viewpager2
    implementation project(':imagepicker')
    // Video→GIF AARs are under app/libs (VideoEditor + ffmpeg-kit-api + ffmpeg-kit).
    // Transitive Maven deps that the VideoEditor AAR does not carry:
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'com.github.bumptech.glide:glide:4.15.0'
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'
    implementation libs.androidx.exifinterface
    implementation libs.colorpickerview
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.okhttp.sse
    implementation libs.play.services.location
    implementation libs.play.services.maps

    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}
